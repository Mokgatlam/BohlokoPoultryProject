services:
  - type: web
    name: bohloko-family-farm-backend
    runtime: node
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1h
      - key: BASE_URL
        fromService:
          type: web
          name: bohloko-family-farm-backend
          property: host
    autoDeploy: true
    healthCheckPath: /api/health

  # Optional: PostgreSQL database for production data persistence
  # Uncomment below to add a free PostgreSQL database
  # - type: pgsql
  #   name: bohloko-db
  #   plan: free
  #   databaseName: bohloko_farm
  #   user: bohloko_user