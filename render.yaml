services:
  - type: web
    name: bohloko-family-farm-backend
    runtime: node
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && node test-start.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1h
      - key: BASE_URL
        fromService:
          type: web
          name: bohloko-family-farm-backend
          property: host
    autoDeploy: true
    healthCheckPath: /api/health

  - type: pgsql
    name: bohloko-db
    plan: free
