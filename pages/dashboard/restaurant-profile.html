<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Profile - Bohloko Family Farm</title>
    <link rel="shortcut icon" type="image/x-icon" href="../../assets/images/icons/favicon.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../assets/css/public.css">
    <style>
        :root { --primary: #1B4332; --accent: #D4A843; }
        .dashboard-header { background: linear-gradient(135deg, var(--primary) 0%, #0d2818 100%); color: white; padding: 30px 0; }
        .profile-card { background: white; border-radius: 12px; padding: 24px; box-shadow: 0 2px 15px rgba(0,0,0,0.05); }
        .form-label { font-weight: 500; font-size: 0.85rem; color: #555; }
        .form-control { border-radius: 8px; border: 1px solid #ddd; padding: 10px 14px; }
        .form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(27,67,50,0.1); }
    </style>
</head>
<body>
    <div class="dashboard-header">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <h4 class="mb-1"><i class="fas fa-store me-2"></i>Restaurant Profile</h4>
                    <p class="mb-0 opacity-75">Manage your business account details</p>
                </div>
                <div>
                    <a href="restaurant.html" class="btn btn-outline-light btn-sm"><i class="fas fa-arrow-left me-1"></i>Dashboard</a>
                </div>
            </div>
        </div>
    </div>

    <div class="container py-4">
        <div class="row g-4">
            <div class="col-lg-4">
                <div class="profile-card text-center">
                    <div class="mx-auto mb-3" style="width:80px;height:80px;border-radius:50%;background:var(--primary);color:white;display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:700;" id="profileAvatar">R</div>
                    <h5 id="profileName">Restaurant</h5>
                    <p class="text-muted mb-2" id="profileEmail">restaurant@email.com</p>
                    <span class="badge bg-success" id="accountStatus">Active</span>
                    <hr>
                    <div class="text-start">
                        <p class="mb-2"><i class="fas fa-phone me-2 text-muted"></i><span id="profilePhone">N/A</span></p>
                        <p class="mb-2"><i class="fas fa-map-marker-alt me-2 text-muted"></i><span id="profileAddress">N/A</span></p>
                        <p class="mb-0"><i class="fas fa-calendar me-2 text-muted"></i>Member since <span id="memberSince">N/A</span></p>
                    </div>
                </div>
                <div class="profile-card mt-4">
                    <h6><i class="fas fa-info-circle me-2"></i>Account Information</h6>
                    <hr>
                    <p class="mb-2"><strong>Account Type:</strong> Wholesale / Restaurant</p>
                    <p class="mb-2"><strong>Payment Terms:</strong> Net 30</p>
                    <p class="mb-0"><strong>Delivery Schedule:</strong> Mon, Wed, Fri</p>
                </div>
            </div>
            <div class="col-lg-8">
                <div class="profile-card">
                    <h5 class="mb-4"><i class="fas fa-edit me-2"></i>Edit Business Details</h5>
                    <form id="profileForm">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Restaurant / Business Name</label>
                                <input type="text" class="form-control" id="editBusinessName" placeholder="Business name">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Contact Person</label>
                                <input type="text" class="form-control" id="editName" placeholder="Contact name">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-control" id="editEmail" disabled>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Phone</label>
                                <input type="tel" class="form-control" id="editPhone" placeholder="+27">
                            </div>
                            <div class="col-12">
                                <label class="form-label">Business Address</label>
                                <textarea class="form-control" id="editAddress" rows="2" placeholder="Business address"></textarea>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Business Registration Number</label>
                                <input type="text" class="form-control" id="editRegNumber" placeholder="Registration number">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">VAT Number</label>
                                <input type="text" class="form-control" id="editVat" placeholder="VAT number">
                            </div>
                            <div class="col-12">
                                <label class="form-label">Preferred Delivery Instructions</label>
                                <textarea class="form-control" id="editDeliveryNotes" rows="2" placeholder="Special delivery instructions..."></textarea>
                            </div>
                        </div>
                        <div class="mt-4 d-flex gap-2">
                            <button type="submit" class="btn btn-success"><i class="fas fa-save me-1"></i>Save Changes</button>
                            <button type="button" class="btn btn-outline-secondary" onclick="loadProfile()"><i class="fas fa-undo me-1"></i>Reset</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="../../assets/js/api.js"></script>
    <script src="../../assets/js/admin.js"></script>
    <script>
        let currentUser = null;

        async function loadProfile() {
            currentUser = JSON.parse(localStorage.getItem('user') || '{}');
            document.getElementById('profileAvatar').textContent = (currentUser.name || 'R').charAt(0).toUpperCase();
            document.getElementById('profileName').textContent = currentUser.restaurantName || currentUser.name || 'Restaurant';
            document.getElementById('profileEmail').textContent = currentUser.email || '';
            document.getElementById('profilePhone').textContent = currentUser.phone || 'N/A';
            document.getElementById('profileAddress').textContent = currentUser.address || 'N/A';
            document.getElementById('editName').value = currentUser.name || '';
            document.getElementById('editEmail').value = currentUser.email || '';
            document.getElementById('editPhone').value = currentUser.phone || '';
            document.getElementById('editAddress').value = currentUser.address || '';
            document.getElementById('editBusinessName').value = currentUser.restaurantName || currentUser.businessName || '';
            if (currentUser.created_at) {
                document.getElementById('memberSince').textContent = new Date(currentUser.created_at).toLocaleDateString();
            }
        }

        document.getElementById('profileForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentUser || !currentUser.id) return alert('User not found. Please login again.');
            const data = {
                name: document.getElementById('editName').value,
                phone: document.getElementById('editPhone').value,
                address: document.getElementById('editAddress').value,
                businessName: document.getElementById('editBusinessName').value
            };
            const res = await api.users.updateProfile(currentUser.id, data);
            if (res.success) {
                localStorage.setItem('user', JSON.stringify({ ...currentUser, ...data }));
                alert('Profile updated successfully!');
                loadProfile();
            } else {
                alert(res.message || 'Failed to update profile.');
            }
        });

        loadProfile();
    </script>
</body>
</html>
