<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful - Bohloko Family Farm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../assets/css/public.css">
    <style>
        body { background: var(--cream, #FDF8F0); min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Segoe UI', sans-serif; }
        .success-card { max-width: 500px; background: white; border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.08); padding: 48px 40px; text-align: center; }
        .success-icon { width: 80px; height: 80px; border-radius: 50%; background: #d4edda; display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; }
        .success-icon i { font-size: 36px; color: #28a745; }
        h2 { color: var(--primary, #1B4332); margin-bottom: 12px; }
        .order-number { background: #f8f9fa; border-radius: 8px; padding: 12px 20px; margin: 20px 0; font-family: monospace; font-size: 16px; }
        .btn-group-custom { display: flex; gap: 12px; justify-content: center; margin-top: 24px; flex-wrap: wrap; }
        .btn-primary-custom { background: var(--primary, #1B4332); color: white; border: none; padding: 12px 24px; border-radius: 8px; text-decoration: none; font-weight: 500; cursor: pointer; transition: background 0.2s; }
        .btn-primary-custom:hover { background: #143725; color: white; }
        .btn-outline { background: white; color: var(--primary, #1B4332); border: 2px solid var(--primary, #1B4332); padding: 10px 22px; border-radius: 8px; text-decoration: none; font-weight: 500; transition: all 0.2s; }
        .btn-outline:hover { background: var(--primary, #1B4332); color: white; }
        .text-muted { color: #6c757d; }
        .spinner { margin-top: 16px; }
    </style>
</head>
<body>
    <div class="success-card">
        <div class="success-icon">
            <i class="fas fa-check"></i>
        </div>
        <h2>Payment Successful!</h2>
        <p class="text-muted">Your payment has been processed by PayFast.</p>

        <div class="order-number" id="orderNumber">
            <i class="fas fa-receipt me-2 text-muted"></i>
            <span id="orderNumberText">Loading order details...</span>
        </div>

        <p class="text-muted" id="statusMessage">Verifying payment status...</p>
        <div class="spinner" id="spinner">
            <div class="spinner-border text-success" role="status" style="width:1.5rem;height:1.5rem;">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>

        <div class="btn-group-custom" id="actionButtons" style="display:none;">
            <a href="#" id="invoiceBtn" class="btn-primary-custom">
                <i class="fas fa-file-invoice me-1"></i> View Invoice
            </a>
            <a href="shop.html" class="btn-outline">
                <i class="fas fa-shopping-cart me-1"></i> Continue Shopping
            </a>
        </div>

        <p class="text-muted mt-3" id="autoRedirect" style="display:none;">
            Redirecting to invoice in <span id="countdown">10</span>s...
        </p>
    </div>

    <script src="../../assets/js/api.js"></script>
    <script>
        (async function() {
            const params = new URLSearchParams(window.location.search);
            const orderId = params.get('id') || params.get('m_payment_id');

            if (!orderId) {
                document.getElementById('orderNumberText').textContent = 'No order ID provided';
                document.getElementById('statusMessage').textContent = '';
                document.getElementById('spinner').style.display = 'none';
                document.getElementById('actionButtons').style.display = 'flex';
                return;
            }

            document.getElementById('orderNumberText').textContent = 'Order #' + orderId.substring(0, 8) + '...';
            document.getElementById('invoiceBtn').href = '../dashboard/customer-invoice.html?id=' + orderId;

            try {
                const result = await api.payfast.getStatus(orderId);
                if (result.success) {
                    const { paymentStatus } = result.data;
                    document.getElementById('spinner').style.display = 'none';

                    if (paymentStatus === 'Paid') {
                        document.getElementById('statusMessage').innerHTML = '<span class="text-success fw-bold">Payment confirmed</span>';
                    } else if (paymentStatus === 'Pending') {
                        document.getElementById('statusMessage').innerHTML = '<span class="text-warning fw-bold">Payment pending</span> — EFT payments may take 1-2 business days to clear.';
                    } else {
                        document.getElementById('statusMessage').innerHTML = '<span class="text-danger fw-bold">Payment ' + paymentStatus + '</span>';
                    }

                    document.getElementById('actionButtons').style.display = 'flex';

                    // Auto-redirect to invoice after 10 seconds
                    if (paymentStatus === 'Paid') {
                        document.getElementById('autoRedirect').style.display = 'block';
                        let count = 10;
                        const timer = setInterval(() => {
                            count--;
                            document.getElementById('countdown').textContent = count;
                            if (count <= 0) {
                                clearInterval(timer);
                                window.location.href = '../dashboard/customer-invoice.html?id=' + orderId;
                            }
                        }, 1000);
                    }
                } else {
                    document.getElementById('spinner').style.display = 'none';
                    document.getElementById('statusMessage').textContent = 'Unable to verify payment status.';
                    document.getElementById('actionButtons').style.display = 'flex';
                }
            } catch (e) {
                document.getElementById('spinner').style.display = 'none';
                document.getElementById('statusMessage').textContent = 'Payment received. Check your order for details.';
                document.getElementById('actionButtons').style.display = 'flex';
            }
        })();
    </script>
</body>
</html>
