<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Cancelled - Bohloko Family Farm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../assets/css/public.css">
    <style>
        body { background: var(--cream, #FDF8F0); min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Segoe UI', sans-serif; }
        .cancel-card { max-width: 500px; background: white; border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.08); padding: 48px 40px; text-align: center; }
        .cancel-icon { width: 80px; height: 80px; border-radius: 50%; background: #f8d7da; display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; }
        .cancel-icon i { font-size: 36px; color: #dc3545; }
        h2 { color: var(--primary, #1B4332); margin-bottom: 12px; }
        .btn-group-custom { display: flex; gap: 12px; justify-content: center; margin-top: 24px; flex-wrap: wrap; }
        .btn-primary-custom { background: var(--primary, #1B4332); color: white; border: none; padding: 12px 24px; border-radius: 8px; text-decoration: none; font-weight: 500; cursor: pointer; transition: background 0.2s; }
        .btn-primary-custom:hover { background: #143725; color: white; }
        .btn-outline { background: white; color: var(--primary, #1B4332); border: 2px solid var(--primary, #1B4332); padding: 10px 22px; border-radius: 8px; text-decoration: none; font-weight: 500; transition: all 0.2s; }
        .btn-outline:hover { background: var(--primary, #1B4332); color: white; }
        .text-muted { color: #6c757d; }
    </style>
</head>
<body>
    <div class="cancel-card">
        <div class="cancel-icon">
            <i class="fas fa-times"></i>
        </div>
        <h2>Payment Cancelled</h2>
        <p class="text-muted">You cancelled the payment process on PayFast.</p>
        <p class="text-muted">Your order has not been charged. You can try again or choose a different payment method.</p>

        <div class="btn-group-custom">
            <a href="shop.html" class="btn-primary-custom">
                <i class="fas fa-redo me-1"></i> Try Again
            </a>
            <a href="../dashboard/customer.html" class="btn-outline">
                <i class="fas fa-user me-1"></i> My Dashboard
            </a>
        </div>
    </div>
</body>
</html>
