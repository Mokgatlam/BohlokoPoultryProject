<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Bohloko Family Farm</title>
    <link rel="shortcut icon" type="image/x-icon" href="../../assets/images/icons/favicon.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../assets/css/public.css">
    <style>
        .error-container { min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; background: linear-gradient(135deg, var(--primary) 0%, #0d2818 100%); color: white; }
        .error-code { font-size: 8rem; font-weight: 700; color: var(--accent); line-height: 1; }
        .error-message { font-size: 1.5rem; margin: 20px 0; }
    </style>
</head>
<body>
    <div class="error-container">
        <div>
            <img src="../../assets/images/logo.png" alt="Logo" style="height:80px;margin-bottom:30px;">
            <div class="error-code">404</div>
            <h1 class="error-message">Page Not Found</h1>
            <p style="color:rgba(255,255,255,0.7);margin-bottom:30px;">The page you're looking for doesn't exist or has been moved.</p>
            <a href="index.html" class="btn-primary-custom"><i class="fas fa-home me-2"></i>Back to Home</a>
            <a href="shop.html" class="btn-outline-light-custom ms-3"><i class="fas fa-shopping-cart me-2"></i>Shop</a>
        </div>
    </div>
</body>
</html>
