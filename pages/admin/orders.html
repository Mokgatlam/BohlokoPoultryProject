<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orders Management - Bohloko Family Farm</title>
    <link rel="shortcut icon" type="image/x-icon" href="../../assets/images/icons/favicon.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
    <link rel="stylesheet" href="../../assets/css/admin.css">
</head>
<body>
    <button class="sidebar-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
    <div class="sidebar-overlay" onclick="toggleSidebar()"></div>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-brand"><img src="../../assets/images/logo.png" alt="Logo"><h5>Bohloko Family Farm</h5><small>Order Management</small></div>
        <div class="sidebar-menu">
            <div class="menu-header">Main</div>
            <a href="dashboard.html"><i class="fas fa-chart-line"></i> Dashboard</a>
            <a href="orders.html" class="active"><i class="fas fa-shopping-cart"></i> Orders</a>
            <div class="menu-header">Management</div>
            <a href="products.html"><i class="fas fa-box"></i> Products</a>
            <a href="inventory.html"><i class="fas fa-warehouse"></i> Inventory</a>
            <a href="production.html"><i class="fas fa-egg"></i> Production</a>
            <a href="payments.html"><i class="fas fa-credit-card"></i> Payments</a>
            <div class="menu-header">People</div>
            <a href="employees.html"><i class="fas fa-users"></i> Employees</a>
            <a href="crm.html"><i class="fas fa-heart"></i> CRM</a>
            <div class="menu-header">System</div>
            <a href="settings.html"><i class="fas fa-cog"></i> Settings</a>
            <a href="system-logs.html"><i class="fas fa-file-alt"></i> System Logs</a>
            <a href="api-keys.html"><i class="fas fa-key"></i> API Keys</a>
        </div>
        <div style="padding:20px;position:absolute;bottom:0;width:100%;"><button class="logout-btn w-100" onclick="logout()"><i class="fas fa-sign-out-alt me-2"></i>Logout</button></div>
    </div>
    <div class="main-content">
        <div class="top-bar"><h4><i class="fas fa-shopping-cart me-2"></i>Order Management</h4></div>
        <div class="card mb-4">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span>All Orders</span>
                <select class="form-select form-select-sm" style="width:auto" onchange="filterOrders(this.value)">
                    <option value="">All Status</option>
                    <option value="Pending">Pending</option>
                    <option value="Confirmed">Confirmed</option>
                    <option value="Processing">Processing</option>
                    <option value="Shipped">Shipped</option>
                    <option value="Delivered">Delivered</option>
                    <option value="Cancelled">Cancelled</option>
                </select>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table">
                        <thead><tr><th>Order #</th><th>Customer</th><th>Date</th><th>Items</th><th>Total</th><th>Status</th><th>Payment</th><th>Actions</th></tr></thead>
                        <tbody id="ordersTable"><tr><td colspan="8" class="text-center">Loading...</td></tr></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <script src="../../assets/js/api.js"></script>
    <script src="../../assets/js/admin.js"></script>
    <script>
        let allOrders = [];
        async function loadOrders() {
            const res = await api.orders.getAllOrders();
            if (res.success) { allOrders = res.data; renderOrders(allOrders); }
        }
        function renderOrders(orders) {
            const tbody = document.getElementById('ordersTable');
            if (!orders.length) { tbody.innerHTML = '<tr><td colspan="8" class="text-center">No orders found</td></tr>'; return; }
            tbody.innerHTML = orders.map(o => `
                <tr>
                    <td><strong>${escapeHtml(o.orderNumber)}</strong></td>
                    <td>${escapeHtml(o.customerName || o.customer || 'N/A')}</td>
                    <td>${o.orderDate ? new Date(o.orderDate).toLocaleDateString() : 'N/A'}</td>
                    <td>${(o.items || []).length} items</td>
                    <td><strong>R ${(o.totalAmount || o.total || 0).toFixed(2)}</strong></td>
                    <td><span class="badge-status badge-${(o.status || 'pending').toLowerCase()}">${escapeHtml(o.status || 'Pending')}</span></td>
                    <td>${escapeHtml(o.paymentStatus || 'Unpaid')}</td>
                    <td>
                        <select class="form-select form-select-sm" style="width:auto" onchange="updateStatus('${o._id}', this.value)">
                            ${['Pending','Confirmed','Processing','Shipped','Delivered','Cancelled'].map(s => `<option value="${s}" ${o.status === s ? 'selected' : ''}>${s}</option>`).join('')}
                        </select>
                    </td>
                </tr>
            `).join('');
        }
        function filterOrders(status) {
            const filtered = status ? allOrders.filter(o => o.status === status) : allOrders;
            renderOrders(filtered);
        }
        async function updateStatus(id, status) {
            try {
                await api.orders.updateStatus(id, status);
                loadOrders();
            } catch (e) { alert('Error updating status'); }
        }
        loadOrders();
    </script>
</body>
</html>
