<!--
  Notifications Page - FR-016 (CRM Notification Display)
  ======================================================
  
  SRS Reference: FR-016 (Customer Relationship Management)
  
  Displays real-time notifications for the Farm Manager. Shows system
  alerts, order notifications, and success messages with visual
  differentiation via color-coded icons.
  
  Architecture:
    - List-based UI with notification items
    - Color-coded icons (order=green, system=blue, alert=red, success=green)
    - Mark All Read / Clear All bulk actions
    - Unread badge indicator
  
  Coding Principles:
    - Template Literals: HTML generated via ES6 template strings
    - DRY: renderNotifications() handles all notification types
    - Client-Side State: Unread status tracked via CSS class toggle
    - Escape: escapeHtml() from admin.js prevents XSS
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - Bohloko Family Farm</title>
    <link rel="shortcut icon" type="image/x-icon" href="../../assets/images/icons/favicon.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
    <link rel="stylesheet" href="../../assets/css/admin.css">
    <style>
        /* Notification item styling */
        .notification-item { padding: 15px; border-bottom: 1px solid #f0f0f0; display: flex; gap: 15px; align-items: flex-start; }
        .notification-item:last-child { border-bottom: none; }
        /* Unread state highlight */
        .notification-item.unread { background: #f8fdf5; }
        /* Icon container - color varies by type */
        .notification-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1rem; flex-shrink: 0; }
        .notification-icon.order { background: #d1fae5; color: #065f46; }
        .notification-icon.system { background: #dbeafe; color: #1e40af; }
        .notification-icon.alert { background: #fee2e2; color: #991b1b; }
        .notification-icon.success { background: #d1fae5; color: #065f46; }
    </style>
</head>
<body>
    <button class="sidebar-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
    <div class="sidebar-overlay" onclick="toggleSidebar()"></div>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-brand"><img src="../../assets/images/logo.png" alt="Logo"><h5>Bohloko Family Farm</h5><small>Notifications</small></div>
        <div class="sidebar-menu">
            <div class="menu-header">Main</div>
            <a href="dashboard.html"><i class="fas fa-chart-line"></i> Dashboard</a>
            <a href="analytics.html"><i class="fas fa-chart-bar"></i> Analytics</a>
            <div class="menu-header">Management</div>
            <a href="products.html"><i class="fas fa-box"></i> Products</a>
            <a href="inventory.html"><i class="fas fa-warehouse"></i> Inventory</a>
            <a href="production.html"><i class="fas fa-egg"></i> Production</a>
            <a href="payments.html"><i class="fas fa-credit-card"></i> Payments</a>
            <div class="menu-header">People</div>
            <a href="employees.html"><i class="fas fa-users"></i> Employees</a>
            <a href="crm.html"><i class="fas fa-heart"></i> CRM</a>
            <div class="menu-header">System</div>
            <a href="settings.html"><i class="fas fa-cog"></i> Settings</a>
            <a href="notifications.html" class="active"><i class="fas fa-bell"></i> Notifications</a>
            <a href="system-logs.html"><i class="fas fa-file-alt"></i> System Logs</a>
            <a href="api-keys.html"><i class="fas fa-key"></i> API Keys</a>
        </div>
        <div style="padding:20px;position:absolute;bottom:0;width:100%;"><button class="logout-btn w-100" onclick="logout()"><i class="fas fa-sign-out-alt me-2"></i>Logout</button></div>
    </div>

    <div class="main-content">
        <div class="top-bar">
            <h4><i class="fas fa-bell me-2"></i>Notifications</h4>
            <div>
                <!-- Bulk action: Mark all as read -->
                <button class="btn btn-outline-success btn-sm" onclick="markAllRead()"><i class="fas fa-check-double me-1"></i>Mark All Read</button>
                <!-- Bulk action: Clear all notifications -->
                <button class="btn btn-outline-danger btn-sm ms-1" onclick="clearAll()"><i class="fas fa-trash me-1"></i>Clear All</button>
            </div>
        </div>
        <div class="card">
            <div class="card-body p-0">
                <!-- Notification list container - dynamically populated -->
                <div id="notificationsList"><p class="text-center p-4">Loading...</p></div>
            </div>
        </div>
    </div>

    <script src="../../assets/js/api.js"></script>
    <script src="../../assets/js/admin.js"></script>
    <script>
        /**
         * Fetch and render all notifications.
         * 
         * Principle: Separation of Concerns
         * - loadNotifications() handles data fetching
         * - renderNotifications() handles DOM rendering
         */
        async function loadNotifications() {
            const res = await api.notifications.getAll();
            if (res.success) renderNotifications(res.data);
        }

        /**
         * Render notification list from data array.
         * 
         * Principle: Template Literals for HTML Generation
         * Each notification is mapped to an HTML string using template literals.
         * Color coding is determined by notification type.
         * 
         * @param {Array} notifications - Notification objects
         */
        function renderNotifications(notifications) {
            const el = document.getElementById('notificationsList');
            if (!notifications.length) {
                el.innerHTML = '<p class="text-center p-4 text-muted">No notifications</p>';
                return;
            }
            el.innerHTML = notifications.map(n => {
                // Determine icon class based on notification type
                const iconClass = n.type === 'order' ? 'order' : n.type === 'system' ? 'system' : n.type === 'alert' ? 'alert' : 'success';
                const icon = n.type === 'order' ? 'fa-shopping-cart' : n.type === 'system' ? 'fa-cog' : n.type === 'alert' ? 'fa-exclamation-triangle' : 'fa-check-circle';
                return `
                    <div class="notification-item ${n.read ? '' : 'unread'}">
                        <div class="notification-icon ${iconClass}"><i class="fas ${icon}"></i></div>
                        <div style="flex:1">
                            <div class="d-flex justify-content-between align-items-start">
                                <div>
                                    <strong>${escapeHtml(n.title || 'Notification')}</strong>
                                    <p class="mb-0 mt-1 text-muted">${escapeHtml(n.message || '')}</p>
                                    <small class="text-muted">${n.createdAt ? new Date(n.createdAt).toLocaleString() : ''}</small>
                                </div>
                                <div>${n.read ? '' : '<span class="badge badge-unread">New</span>'}</div>
                            </div>
                        </div>
                    </div>`;
            }).join('');
        }

        /**
         * Mark all notifications as read.
         * Principle: Optimistic UI - reloads after API call
         */
        async function markAllRead() {
            await api.notifications.markAllRead();
            loadNotifications();
        }

        /**
         * Clear all notifications with confirmation.
         * Principle: Confirmation Dialog for Destructive Actions
         */
        async function clearAll() {
            if (confirm('Clear all notifications?')) {
                await api.notifications.clearAll();
                loadNotifications();
            }
        }

        // Initialize on page load
        loadNotifications();
    </script>
</body>
</html>
