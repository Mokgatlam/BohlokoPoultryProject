<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poultry Care - Bohloko Family Farm</title>
    <link rel="shortcut icon" type="image/x-icon" href="../../assets/images/icons/favicon.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
    <style>
        :root { --primary: #1B4332; --accent: #D4A843; --cream: #FDF8F0; --success: #28a745; --warning: #ffc107; --danger: #dc3545; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f0f2f5; min-height: 100vh; }
        .mobile-header { background: var(--primary); color: white; padding: 15px 20px; position: sticky; top: 0; z-index: 100; }
        .mobile-header h5 { margin: 0; font-size: 1.1rem; }
        .mobile-header small { opacity: 0.8; font-size: 0.8rem; }
        .content { padding: 15px; padding-bottom: 80px; }
        .stat-row { display: flex; gap: 10px; margin-bottom: 15px; overflow-x: auto; }
        .stat-box { background: white; border-radius: 12px; padding: 15px; min-width: 100px; flex: 1; box-shadow: 0 2px 8px rgba(0,0,0,0.06); text-align: center; }
        .stat-box .icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; margin: 0 auto 8px; font-size: 1.1rem; }
        .stat-box .icon.green { background: rgba(27,67,50,0.1); color: var(--primary); }
        .stat-box .icon.gold { background: rgba(212,168,67,0.1); color: var(--accent); }
        .stat-box .icon.blue { background: rgba(59,130,246,0.1); color: #3b82f6; }
        .stat-box .icon.red { background: rgba(239,68,68,0.1); color: #ef4444; }
        .stat-box h4 { font-size: 1.3rem; margin: 0; font-weight: 700; }
        .stat-box small { color: #666; font-size: 0.75rem; }
        .card { border: none; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 15px; }
        .card-header { background: white; border-bottom: 1px solid #eee; padding: 12px 15px; font-weight: 600; font-size: 0.95rem; border-radius: 12px 12px 0 0 !important; }
        .card-body { padding: 15px; }
        .btn-main { background: var(--primary); color: white; border: none; border-radius: 8px; padding: 10px 20px; font-weight: 600; width: 100%; }
        .btn-main:hover { background: #143a28; color: white; }
        .form-label { font-weight: 500; font-size: 0.85rem; margin-bottom: 4px; }
        .form-control, .form-select { border-radius: 8px; border: 1px solid #ddd; padding: 10px 12px; font-size: 0.9rem; }
        .table { font-size: 0.85rem; }
        .table th { font-weight: 600; font-size: 0.8rem; color: #666; }
        .badge-status { padding: 4px 10px; border-radius: 15px; font-size: 0.75rem; font-weight: 500; }
        .badge-approved { background: #d1fae5; color: #065f46; }
        .badge-pending { background: #fef3c7; color: #92400e; }
        .badge-cancelled { background: #fee2e2; color: #991b1b; }
        .badge-processing { background: #dbeafe; color: #1e40af; }
        .quick-action { display: flex; align-items: center; gap: 10px; padding: 12px 15px; background: white; border-radius: 10px; margin-bottom: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.04); cursor: pointer; border: none; width: 100%; text-align: left; }
        .quick-action:hover { background: #f8f9fa; }
        .quick-action .icon { width: 42px; height: 42px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; }
        .quick-action h6 { margin: 0; font-size: 0.9rem; font-weight: 600; }
        .quick-action small { color: #888; font-size: 0.75rem; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 1px solid #eee; display: flex; padding: 8px 0; z-index: 100; }
        .bottom-nav a { flex: 1; text-align: center; color: #666; text-decoration: none; font-size: 0.7rem; padding: 5px; }
        .bottom-nav a.active { color: var(--primary); }
        .bottom-nav a i { display: block; font-size: 1.2rem; margin-bottom: 2px; }
        .modal-content { border-radius: 12px; }
        .modal-header { background: var(--primary); color: white; border-radius: 12px 12px 0 0; }
    </style>
    <link rel="stylesheet" href="../../assets/css/staff.css">
</head>
<body>
    <div class="mobile-header">
        <div class="d-flex justify-content-between align-items-center">
            <div>
                <h5><i class="fas fa-heartbeat me-2"></i>Poultry Care</h5>
                <small id="staffName">Loading...</small>
            </div>
            <button class="btn btn-sm btn-outline-light" onclick="logout()"><i class="fas fa-sign-out-alt"></i></button>
        </div>
    </div>

    <div class="content">
        <div class="stat-row">
            <div class="stat-box">
                <div class="icon green"><i class="fas fa-dove"></i></div>
                <h4 id="statBirds">0</h4>
                <small>Total Birds</small>
            </div>
            <div class="stat-box">
                <div class="icon gold"><i class="fas fa-exclamation-triangle"></i></div>
                <h4 id="statMortality">0</h4>
                <small>Today Mortality</small>
            </div>
            <div class="stat-box">
                <div class="icon blue"><i class="fas fa-clipboard-check"></i></div>
                <h4 id="statLogs">0</h4>
                <small>Logs Today</small>
            </div>
            <div class="stat-box">
                <div class="icon red"><i class="fas fa-syringe"></i></div>
                <h4 id="statVacc">0</h4>
                <small>Pending Vacc</small>
            </div>
        </div>

        <h6 style="font-weight:600;margin-bottom:12px;">Quick Actions</h6>
        <button class="quick-action" onclick="openModal('dailyLog')">
            <div class="icon" style="background:rgba(27,67,50,0.1);color:var(--primary);"><i class="fas fa-clipboard-list"></i></div>
            <div><h6>Daily Log</h6><small>Record bird count, feed, mortality</small></div>
        </button>
        <button class="quick-action" onclick="openModal('healthCheck')">
            <div class="icon" style="background:rgba(239,68,68,0.1);color:#ef4444;"><i class="fas fa-heartbeat"></i></div>
            <div><h6>Health Check</h6><small>Inspect bird health status</small></div>
        </button>
        <button class="quick-action" onclick="openModal('medication')">
            <div class="icon" style="background:rgba(59,130,246,0.1);color:#3b82f6;"><i class="fas fa-pills"></i></div>
            <div><h6>Log Medication</h6><small>Record medication administration</small></div>
        </button>
        <button class="quick-action" onclick="openModal('weight')">
            <div class="icon" style="background:rgba(212,168,67,0.1);color:var(--accent);"><i class="fas fa-weight"></i></div>
            <div><h6>Record Weight</h6><small>Track bird weight samples</small></div>
        </button>
        <button class="quick-action" onclick="openModal('feed')">
            <div class="icon" style="background:rgba(34,197,94,0.1);color:#22c55e;"><i class="fas fa-utensils"></i></div>
            <div><h6>Log Feed</h6><small>Record feed consumption</small></div>
        </button>
        <button class="quick-action" onclick="openModal('environment')">
            <div class="icon" style="background:rgba(168,85,247,0.1);color:#a855f7;"><i class="fas fa-thermometer-half"></i></div>
            <div><h6>Environment</h6><small>Record temp, humidity, ventilation</small></div>
        </button>

        <div class="card mt-3">
            <div class="card-header"><i class="fas fa-history me-2"></i>Recent Activity</div>
            <div class="card-body" id="recentActivity" style="max-height:300px;overflow-y:auto;">
                <p class="text-muted text-center">Loading...</p>
            </div>
        </div>

        <div class="card">
            <div class="card-header"><i class="fas fa-syringe me-2"></i>Upcoming Vaccinations</div>
            <div class="card-body" id="upcomingVacc" style="max-height:200px;overflow-y:auto;">
                <p class="text-muted text-center">Loading...</p>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <a href="poultry.html" class="active"><i class="fas fa-heartbeat"></i>Care</a>
        <a href="processing.html"><i class="fas fa-cut"></i>Process</a>
        <a href="sales.html"><i class="fas fa-shopping-cart"></i>Sales</a>
        <a href="../admin/dashboard.html"><i class="fas fa-cog"></i>Admin</a>
    </div>

    <div class="modal fade" id="formModal" tabindex="-1">
        <div class="modal-dialog modal-fullscreen-sm-down">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Form</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="modalBody"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/api.js"></script>
    <script>
        let allCycles = [];

        function checkAuth() {
            const token = localStorage.getItem('token');
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            if (!token || !['Poultry Attendant', 'Farm Manager'].includes(user.role)) {
                alert('Please login as Poultry Attendant');
                window.location.href = '../public/login.html';
                return false;
            }
            document.getElementById('staffName').textContent = `${user.firstName} ${user.lastName} — ${user.role}`;
            return true;
        }

        function logout() {
            api.removeToken();
            window.location.href = '../public/login.html';
        }

        function openModal(type) {
            const titles = { dailyLog: 'Daily Log', healthCheck: 'Health Check', medication: 'Log Medication', weight: 'Record Weight', feed: 'Log Feed', environment: 'Environment' };
            document.getElementById('modalTitle').textContent = titles[type] || 'Form';
            
            const cycleOptions = allCycles.map(c => `<option value="${c._id}">${c.cycleName}</option>`).join('');
            const today = new Date().toISOString().split('T')[0];

            const forms = {
                dailyLog: `
                    <div class="mb-3"><label class="form-label">Cycle *</label><select class="form-select" id="fCycle">${cycleOptions}</select></div>
                    <div class="mb-3"><label class="form-label">Date *</label><input type="date" class="form-control" id="fDate" value="${today}"></div>
                    <div class="mb-3"><label class="form-label">Bird Count *</label><input type="number" class="form-control" id="fBirdCount" min="0"></div>
                    <div class="mb-3"><label class="form-label">Feed Consumption (kg)</label><input type="number" class="form-control" id="fFeed" step="0.1" value="0"></div>
                    <div class="mb-3"><label class="form-label">Water Consumption (L)</label><input type="number" class="form-control" id="fWater" step="0.1" value="0"></div>
                    <div class="mb-3"><label class="form-label">Mortality Count</label><input type="number" class="form-control" id="fMortality" min="0" value="0"></div>
                    <div class="mb-3"><label class="form-label">Activities / Notes</label><textarea class="form-control" id="fActivities" rows="2" placeholder="e.g., cleaned troughs, observed behavior"></textarea></div>
                    <button class="btn btn-main" onclick="submitDailyLog()">Save Log</button>`,
                healthCheck: `
                    <div class="mb-3"><label class="form-label">Cycle *</label><select class="form-select" id="fCycle">${cycleOptions}</select></div>
                    <div class="mb-3"><label class="form-label">Date *</label><input type="date" class="form-control" id="fDate" value="${today}"></div>
                    <div class="mb-3"><label class="form-label">Birds Checked *</label><input type="number" class="form-control" id="fBirdsChecked" min="1"></div>
                    <div class="mb-3"><label class="form-label">Overall Health *</label>
                        <select class="form-select" id="fHealth"><option>Excellent</option><option>Good</option><option>Fair</option><option>Poor</option><option>Critical</option></select></div>
                    <div class="mb-3"><label class="form-label">Issues Observed</label><textarea class="form-control" id="fIssues" rows="2" placeholder="e.g., respiratory issues, lameness, eye discharge"></textarea></div>
                    <div class="mb-3"><label class="form-label">Actions Taken</label><textarea class="form-control" id="fActions" rows="2" placeholder="e.g., isolated birds, called vet"></textarea></div>
                    <button class="btn btn-main" onclick="submitHealthCheck()">Save Health Check</button>`,
                medication: `
                    <div class="mb-3"><label class="form-label">Cycle *</label><select class="form-select" id="fCycle">${cycleOptions}</select></div>
                    <div class="mb-3"><label class="form-label">Date *</label><input type="date" class="form-control" id="fDate" value="${today}"></div>
                    <div class="mb-3"><label class="form-label">Medication Name *</label><input type="text" class="form-control" id="fMedName" placeholder="e.g., Amoxicillin, Vitamins"></div>
                    <div class="mb-3"><label class="form-label">Dosage *</label><input type="text" class="form-control" id="fDosage" placeholder="e.g., 20mg/L water"></div>
                    <div class="mb-3"><label class="form-label">Reason</label><input type="text" class="form-control" id="fReason" placeholder="e.g., Prevention, Respiratory treatment"></div>
                    <div class="mb-3"><label class="form-label">Withdrawal Period (days)</label><input type="number" class="form-control" id="fWithdrawal" value="7"></div>
                    <button class="btn btn-main" onclick="submitMedication()">Save Medication</button>`,
                weight: `
                    <div class="mb-3"><label class="form-label">Cycle *</label><select class="form-select" id="fCycle">${cycleOptions}</select></div>
                    <div class="mb-3"><label class="form-label">Date *</label><input type="date" class="form-control" id="fDate" value="${today}"></div>
                    <div class="mb-3"><label class="form-label">Average Weight (grams) *</label><input type="number" class="form-control" id="fAvgWeight" step="0.1" min="0"></div>
                    <div class="mb-3"><label class="form-label">Sample Size (birds weighed)</label><input type="number" class="form-control" id="fSampleSize" min="1"></div>
                    <div class="mb-3"><label class="form-label">Notes</label><input type="text" class="form-control" id="fWeightNotes" placeholder="e.g., Uniform growth, some underweight"></div>
                    <button class="btn btn-main" onclick="submitWeight()">Save Weight</button>`,
                feed: `
                    <div class="mb-3"><label class="form-label">Cycle *</label><select class="form-select" id="fCycle">${cycleOptions}</select></div>
                    <div class="mb-3"><label class="form-label">Date *</label><input type="date" class="form-control" id="fDate" value="${today}"></div>
                    <div class="mb-3"><label class="form-label">Feed Type *</label>
                        <select class="form-select" id="fFeedType"><option>Starter Feed</option><option>Grower Feed</option><option>Finisher Feed</option><option>Layer Feed</option><option>Supplement</option></select></div>
                    <div class="mb-3"><label class="form-label">Quantity (kg) *</label><input type="number" class="form-control" id="fFeedQty" step="0.1" min="0"></div>
                    <div class="mb-3"><label class="form-label">Cost (R)</label><input type="number" class="form-control" id="fFeedCost" step="0.01"></div>
                    <button class="btn btn-main" onclick="submitFeed()">Save Feed Record</button>`,
                environment: `
                    <div class="mb-3"><label class="form-label">Cycle *</label><select class="form-select" id="fCycle">${cycleOptions}</select></div>
                    <div class="mb-3"><label class="form-label">Date *</label><input type="date" class="form-control" id="fDate" value="${today}"></div>
                    <div class="mb-3"><label class="form-label">Temperature (°C) *</label><input type="number" class="form-control" id="fTemp" step="0.1"></div>
                    <div class="mb-3"><label class="form-label">Humidity (%)</label><input type="number" class="form-control" id="fHumidity" min="0" max="100"></div>
                    <div class="mb-3"><label class="form-label">Ventilation</label>
                        <select class="form-select" id="fVentilation"><option>Natural</option><option>Mechanical</option><option>Mixed</option><option>None</option></select></div>
                    <div class="mb-3"><label class="form-label">Lighting (hours)</label><input type="number" class="form-control" id="fLight" step="0.5"></div>
                    <div class="mb-3"><label class="form-label">Notes</label><input type="text" class="form-control" id="fEnvNotes" placeholder="e.g., Drafty corner, smell"></div>
                    <button class="btn btn-main" onclick="submitEnvironment()">Save Environment</button>`
            };
            document.getElementById('modalBody').innerHTML = forms[type];
            new bootstrap.Modal(document.getElementById('formModal')).show();
        }

        async function submitDailyLog() {
            try {
                await api.production.createDailyLog({
                    cycle: document.getElementById('fCycle').value,
                    date: document.getElementById('fDate').value,
                    birdCount: parseInt(document.getElementById('fBirdCount').value),
                    feedConsumption: parseFloat(document.getElementById('fFeed').value) || 0,
                    waterConsumption: parseFloat(document.getElementById('fWater').value) || 0,
                    mortality: { count: parseInt(document.getElementById('fMortality').value) || 0 },
                    activities: document.getElementById('fActivities').value
                });
                bootstrap.Modal.getInstance(document.getElementById('formModal')).hide();
                loadData();
                alert('Daily log saved!');
            } catch (e) { alert('Error saving log'); }
        }

        async function submitHealthCheck() {
            try {
                await api.post('/production/health-checks', {
                    cycle: document.getElementById('fCycle').value,
                    date: document.getElementById('fDate').value,
                    birdsChecked: parseInt(document.getElementById('fBirdsChecked').value),
                    overallHealth: document.getElementById('fHealth').value,
                    issuesObserved: document.getElementById('fIssues').value,
                    actionsTaken: document.getElementById('fActions').value
                });
                bootstrap.Modal.getInstance(document.getElementById('formModal')).hide();
                loadData();
                alert('Health check saved!');
            } catch (e) { alert('Error saving health check'); }
        }

        async function submitMedication() {
            try {
                await api.production.createMedication({
                    cycle: document.getElementById('fCycle').value,
                    date: document.getElementById('fDate').value,
                    medicationName: document.getElementById('fMedName').value,
                    dosage: document.getElementById('fDosage').value,
                    reason: document.getElementById('fReason').value,
                    withdrawalPeriod: parseInt(document.getElementById('fWithdrawal').value)
                });
                bootstrap.Modal.getInstance(document.getElementById('formModal')).hide();
                loadData();
                alert('Medication logged!');
            } catch (e) { alert('Error logging medication'); }
        }

        async function submitWeight() {
            try {
                await api.production.createWeightRecord({
                    cycle: document.getElementById('fCycle').value,
                    date: document.getElementById('fDate').value,
                    averageWeight: parseFloat(document.getElementById('fAvgWeight').value),
                    sampleSize: parseInt(document.getElementById('fSampleSize').value) || 0,
                    notes: document.getElementById('fWeightNotes').value
                });
                bootstrap.Modal.getInstance(document.getElementById('formModal')).hide();
                loadData();
                alert('Weight recorded!');
            } catch (e) { alert('Error recording weight'); }
        }

        async function submitFeed() {
            try {
                await api.production.createFeedRecord({
                    cycle: document.getElementById('fCycle').value,
                    date: document.getElementById('fDate').value,
                    feedType: document.getElementById('fFeedType').value,
                    quantityKg: parseFloat(document.getElementById('fFeedQty').value),
                    cost: parseFloat(document.getElementById('fFeedCost').value) || 0
                });
                bootstrap.Modal.getInstance(document.getElementById('formModal')).hide();
                loadData();
                alert('Feed record saved!');
            } catch (e) { alert('Error saving feed'); }
        }

        async function submitEnvironment() {
            try {
                await api.production.createEnvironmentRecord({
                    cycle: document.getElementById('fCycle').value,
                    date: document.getElementById('fDate').value,
                    temperature: parseFloat(document.getElementById('fTemp').value),
                    humidity: parseInt(document.getElementById('fHumidity').value) || 0,
                    ventilation: document.getElementById('fVentilation').value,
                    lightingHours: parseFloat(document.getElementById('fLight').value) || 0,
                    notes: document.getElementById('fEnvNotes').value
                });
                bootstrap.Modal.getInstance(document.getElementById('formModal')).hide();
                loadData();
                alert('Environment recorded!');
            } catch (e) { alert('Error recording environment'); }
        }

        async function loadData() {
            try {
                const cycles = await api.production.getCycles();
                allCycles = cycles.success ? cycles.data.filter(c => c.status === 'Active' || c.status === 'Approved') : [];

                const dash = await api.get('/production/care-dashboard');
                if (dash.success) {
                    document.getElementById('statBirds').textContent = dash.data.totalBirds;
                    document.getElementById('statMortality').textContent = dash.data.todayMortality;
                    document.getElementById('statVacc').textContent = dash.data.upcomingVaccinations?.length || 0;
                }

                let recentHtml = '';
                for (const cycle of allCycles.slice(0, 3)) {
                    const logs = await api.production.getDailyLogs(cycle._id);
                    if (logs.success && logs.data.length) {
                        logs.data.slice(0, 3).forEach(l => {
                            recentHtml += `<div class="d-flex justify-content-between align-items-center py-2 border-bottom">
                                <div><small class="text-muted">${new Date(l.date).toLocaleDateString()}</small><br><small>${cycle.cycleName} — ${l.birdCount} birds</small></div>
                                <span class="badge-status badge-${l.mortality?.count > 0 ? 'cancelled' : 'approved'}">${l.mortality?.count || 0} mortality</span>
                            </div>`;
                        });
                    }
                }
                document.getElementById('recentActivity').innerHTML = recentHtml || '<p class="text-muted text-center">No recent activity</p>';

                let vaccHtml = '';
                for (const cycle of allCycles) {
                    const vaccs = await api.production.getVaccinations(cycle._id);
                    if (vaccs.success) {
                        vaccs.data.filter(v => v.status !== 'Completed').slice(0, 3).forEach(v => {
                            vaccHtml += `<div class="d-flex justify-content-between align-items-center py-2 border-bottom">
                                <div><small>${v.vaccineName}</small><br><small class="text-muted">${cycle.cycleName}</small></div>
                                <span class="badge-status badge-pending">${new Date(v.scheduledDate).toLocaleDateString()}</span>
                            </div>`;
                        });
                    }
                }
                document.getElementById('upcomingVacc').innerHTML = vaccHtml || '<p class="text-muted text-center">No pending vaccinations</p>';
            } catch (e) { console.error(e); }
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (checkAuth()) loadData();
        });
    </script>
</body>
</html>
