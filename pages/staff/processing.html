<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processing - Bohloko Family Farm</title>
    <link rel="shortcut icon" type="image/x-icon" href="../../assets/images/icons/favicon.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
    <style>
        :root { --primary: #1B4332; --accent: #D4A843; --cream: #FDF8F0; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f0f2f5; min-height: 100vh; }
        .mobile-header { background: var(--primary); color: white; padding: 15px 20px; position: sticky; top: 0; z-index: 100; }
        .mobile-header h5 { margin: 0; font-size: 1.1rem; }
        .mobile-header small { opacity: 0.8; font-size: 0.8rem; }
        .content { padding: 15px; padding-bottom: 80px; }
        .stat-row { display: flex; gap: 10px; margin-bottom: 15px; overflow-x: auto; }
        .stat-box { background: white; border-radius: 12px; padding: 15px; min-width: 100px; flex: 1; box-shadow: 0 2px 8px rgba(0,0,0,0.06); text-align: center; }
        .stat-box .icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; margin: 0 auto 8px; font-size: 1.1rem; }
        .stat-box .icon.green { background: rgba(27,67,50,0.1); color: var(--primary); }
        .stat-box .icon.gold { background: rgba(212,168,67,0.1); color: var(--accent); }
        .stat-box .icon.blue { background: rgba(59,130,246,0.1); color: #3b82f6; }
        .stat-box h4 { font-size: 1.3rem; margin: 0; font-weight: 700; }
        .stat-box small { color: #666; font-size: 0.75rem; }
        .card { border: none; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 15px; }
        .card-header { background: white; border-bottom: 1px solid #eee; padding: 12px 15px; font-weight: 600; font-size: 0.95rem; border-radius: 12px 12px 0 0 !important; }
        .card-body { padding: 15px; }
        .btn-main { background: var(--primary); color: white; border: none; border-radius: 8px; padding: 10px 20px; font-weight: 600; width: 100%; }
        .btn-main:hover { background: #143a28; color: white; }
        .form-label { font-weight: 500; font-size: 0.85rem; margin-bottom: 4px; }
        .form-control, .form-select { border-radius: 8px; border: 1px solid #ddd; padding: 10px 12px; font-size: 0.9rem; }
        .table { font-size: 0.85rem; }
        .table th { font-weight: 600; font-size: 0.8rem; color: #666; }
        .badge-status { padding: 4px 10px; border-radius: 15px; font-size: 0.75rem; font-weight: 500; }
        .badge-approved { background: #d1fae5; color: #065f46; }
        .badge-pending { background: #fef3c7; color: #92400e; }
        .badge-cancelled { background: #fee2e2; color: #991b1b; }
        .badge-processing { background: #dbeafe; color: #1e40af; }
        .quick-action { display: flex; align-items: center; gap: 10px; padding: 12px 15px; background: white; border-radius: 10px; margin-bottom: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.04); cursor: pointer; border: none; width: 100%; text-align: left; }
        .quick-action:hover { background: #f8f9fa; }
        .quick-action .icon { width: 42px; height: 42px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; }
        .quick-action h6 { margin: 0; font-size: 0.9rem; font-weight: 600; }
        .quick-action small { color: #888; font-size: 0.75rem; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 1px solid #eee; display: flex; padding: 8px 0; z-index: 100; }
        .bottom-nav a { flex: 1; text-align: center; color: #666; text-decoration: none; font-size: 0.7rem; padding: 5px; }
        .bottom-nav a.active { color: var(--primary); }
        .bottom-nav a i { display: block; font-size: 1.2rem; margin-bottom: 2px; }
        .modal-content { border-radius: 12px; }
        .modal-header { background: var(--primary); color: white; border-radius: 12px 12px 0 0; }
    </style>
    <link rel="stylesheet" href="../../assets/css/staff.css">
</head>
<body>
    <div class="mobile-header">
        <div class="d-flex justify-content-between align-items-center">
            <div>
                <h5><i class="fas fa-cut me-2"></i>Processing</h5>
                <small id="staffName">Loading...</small>
            </div>
            <button class="btn btn-sm btn-outline-light" onclick="logout()"><i class="fas fa-sign-out-alt"></i></button>
        </div>
    </div>

    <div class="content">
        <div class="stat-row">
            <div class="stat-box">
                <div class="icon green"><i class="fas fa-industry"></i></div>
                <h4 id="statProcessing">0</h4>
                <small>In Progress</small>
            </div>
            <div class="stat-box">
                <div class="icon gold"><i class="fas fa-check-circle"></i></div>
                <h4 id="statCompleted">0</h4>
                <small>Completed Today</small>
            </div>
            <div class="stat-box">
                <div class="icon blue"><i class="fas fa-chart-line"></i></div>
                <h4 id="statYield">0%</h4>
                <small>Avg Yield</small>
            </div>
        </div>

        <h6 style="font-weight:600;margin-bottom:12px;">Quick Actions</h6>
        <button class="quick-action" onclick="openModal('addStep')">
            <div class="icon" style="background:rgba(27,67,50,0.1);color:var(--primary);"><i class="fas fa-plus-circle"></i></div>
            <div><h6>Add Processing Step</h6><small>Record slaughter, cut, package, etc.</small></div>
        </button>
        <button class="quick-action" onclick="openModal('qualityCheck')">
            <div class="icon" style="background:rgba(59,130,246,0.1);color:#3b82f6;"><i class="fas fa-check-double"></i></div>
            <div><h6>Quality Check</h6><small>Temperature, visual, weight check</small></div>
        </button>
        <button class="quick-action" onclick="openModal('recordYield')">
            <div class="icon" style="background:rgba(212,168,67,0.1);color:var(--accent);"><i class="fas fa-balance-scale"></i></div>
            <div><h6>Record Yield</h6><small>Input vs output weight</small></div>
        </button>
        <button class="quick-action" onclick="openModal('completeBatch')">
            <div class="icon" style="background:rgba(34,197,94,0.1);color:#22c55e;"><i class="fas fa-box"></i></div>
            <div><h6>Complete Batch</h6><small>Finalize processing batch</small></div>
        </button>

        <div class="card mt-3">
            <div class="card-header"><i class="fas fa-list-ol me-2"></i>Active Processing Batches</div>
            <div class="card-body" id="batchList" style="max-height:400px;overflow-y:auto;">
                <p class="text-muted text-center">Loading...</p>
            </div>
        </div>

        <div class="card">
            <div class="card-header"><i class="fas fa-history me-2"></i>Recent Steps</div>
            <div class="card-body" id="recentSteps" style="max-height:300px;overflow-y:auto;">
                <p class="text-muted text-center">Loading...</p>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <a href="poultry.html"><i class="fas fa-heartbeat"></i>Care</a>
        <a href="processing.html" class="active"><i class="fas fa-cut"></i>Process</a>
        <a href="sales.html"><i class="fas fa-shopping-cart"></i>Sales</a>
        <a href="../admin/dashboard.html"><i class="fas fa-cog"></i>Admin</a>
    </div>

    <div class="modal fade" id="formModal" tabindex="-1">
        <div class="modal-dialog modal-fullscreen-sm-down">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Form</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="modalBody"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/api.js"></script>
    <script>
        let allProcessingBatches = [];

        function checkAuth() {
            const token = localStorage.getItem('token');
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            if (!token || !['Processing Staff', 'Farm Manager'].includes(user.role)) {
                alert('Please login as Processing Staff');
                window.location.href = '../public/login.html';
                return false;
            }
            document.getElementById('staffName').textContent = `${user.firstName} ${user.lastName} — ${user.role}`;
            return true;
        }

        function logout() {
            api.removeToken();
            window.location.href = '../public/login.html';
        }

        function openModal(type) {
            const titles = { addStep: 'Add Processing Step', qualityCheck: 'Quality Check', recordYield: 'Record Yield', completeBatch: 'Complete Batch' };
            document.getElementById('modalTitle').textContent = titles[type];
            
            const batchOptions = allProcessingBatches.filter(b => b.status === 'Processing').map(b => `<option value="${b._id}">${b.batchNumber} - ${b.productType}</option>`).join('');
            const today = new Date().toISOString().split('T')[0];

            const forms = {
                addStep: `
                    <div class="mb-3"><label class="form-label">Processing Batch *</label><select class="form-select" id="fBatch">${batchOptions || '<option>No active batches</option>'}</select></div>
                    <div class="mb-3"><label class="form-label">Step Type *</label>
                        <select class="form-select" id="fStepType"><option>Slaughter</option><option>Pluck</option><option>Eviscerate</option><option>Cut</option><option>Portion</option><option>Package</option><option>Label</option><option>Freeze</option><option>Store</option></select></div>
                    <div class="mb-3"><label class="form-label">Start Time *</label><input type="datetime-local" class="form-control" id="fStartTime"></div>
                    <div class="mb-3"><label class="form-label">Birds Processed</label><input type="number" class="form-control" id="fBirdsProcessed" min="0"></div>
                    <div class="mb-3"><label class="form-label">Notes</label><input type="text" class="form-control" id="fStepNotes" placeholder="e.g., Good condition, some defects"></div>
                    <button class="btn btn-main" onclick="submitStep()">Start Step</button>`,
                qualityCheck: `
                    <div class="mb-3"><label class="form-label">Processing Batch *</label><select class="form-select" id="fBatch">${batchOptions || '<option>No active batches</option>'}</select></div>
                    <div class="mb-3"><label class="form-label">Check Type *</label>
                        <select class="form-select" id="fCheckType"><option>Temperature Check</option><option>Visual Inspection</option><option>Weight Verification</option><option>Hygiene Check</option><option>Packaging Integrity</option><option>Label Accuracy</option></select></div>
                    <div class="mb-3"><label class="form-label">Result *</label>
                        <select class="form-select" id="fResult"><option>Pass</option><option>Fail</option><option>Conditional</option></select></div>
                    <div class="mb-3"><label class="form-label">Temperature (°C)</label><input type="number" class="form-control" id="fQcTemp" step="0.1"></div>
                    <div class="mb-3"><label class="form-label">Findings</label><textarea class="form-control" id="fFindings" rows="2" placeholder="Describe findings..."></textarea></div>
                    <button class="btn btn-main" onclick="submitQualityCheck()">Submit Check</button>`,
                recordYield: `
                    <div class="mb-3"><label class="form-label">Processing Batch *</label><select class="form-select" id="fBatch">${batchOptions || '<option>No active batches</option>'}</select></div>
                    <div class="mb-3"><label class="form-label">Product Type *</label>
                        <select class="form-select" id="fProductType"><option>Whole Chicken</option><option>Breast</option><option>Thighs</option><option>Wings</option><option>Drumsticks</option><option>Sausages</option></select></div>
                    <div class="mb-3"><label class="form-label">Input Weight (kg) *</label><input type="number" class="form-control" id="fInputWeight" step="0.1" min="0"></div>
                    <div class="mb-3"><label class="form-label">Output Weight (kg) *</label><input type="number" class="form-control" id="fOutputWeight" step="0.1" min="0"></div>
                    <div class="mb-3"><label class="form-label">Waste Weight (kg)</label><input type="number" class="form-control" id="fWasteWeight" step="0.1" value="0"></div>
                    <button class="btn btn-main" onclick="submitYield()">Record Yield</button>`,
                completeBatch: `
                    <div class="mb-3"><label class="form-label">Processing Batch *</label><select class="form-select" id="fBatch">${batchOptions || '<option>No active batches</option>'}</select></div>
                    <div class="mb-3"><label class="form-label">Output Quantity (units) *</label><input type="number" class="form-control" id="fOutputQty" min="1"></div>
                    <div class="mb-3"><label class="form-label">Output Weight (kg) *</label><input type="number" class="form-control" id="fOutputWeight" step="0.1"></div>
                    <div class="mb-3"><label class="form-label">Waste Weight (kg)</label><input type="number" class="form-control" id="fWasteWeight" step="0.1" value="0"></div>
                    <div class="mb-3"><label class="form-label">Storage Location</label><input type="text" class="form-control" id="fStorage" value="Cold Storage A"></div>
                    <div class="form-check mb-3"><input class="form-check-input" type="checkbox" id="fCreateInv" checked><label class="form-check-label">Add to Inventory</label></div>
                    <button class="btn btn-main" onclick="submitComplete()">Complete Batch</button>`
            };
            document.getElementById('modalBody').innerHTML = forms[type];
            new bootstrap.Modal(document.getElementById('formModal')).show();
        }

        async function submitStep() {
            try {
                const now = new Date().toISOString();
                await api.post('/harvest/processing-steps', {
                    processingBatch: document.getElementById('fBatch').value,
                    stepType: document.getElementById('fStepType').value,
                    startTime: document.getElementById('fStartTime').value || now,
                    birdsProcessed: parseInt(document.getElementById('fBirdsProcessed').value) || 0,
                    notes: document.getElementById('fStepNotes').value
                });
                bootstrap.Modal.getInstance(document.getElementById('formModal')).hide();
                loadData();
                alert('Step added!');
            } catch (e) { alert('Error adding step'); }
        }

        async function submitQualityCheck() {
            try {
                await api.post('/harvest/quality-checks', {
                    processingBatch: document.getElementById('fBatch').value,
                    checkType: document.getElementById('fCheckType').value,
                    result: document.getElementById('fResult').value,
                    temperature: parseFloat(document.getElementById('fQcTemp').value) || null,
                    findings: document.getElementById('fFindings').value
                });
                bootstrap.Modal.getInstance(document.getElementById('formModal')).hide();
                loadData();
                alert('Quality check recorded!');
            } catch (e) { alert('Error recording check'); }
        }

        async function submitYield() {
            try {
                const input = parseFloat(document.getElementById('fInputWeight').value);
                const output = parseFloat(document.getElementById('fOutputWeight').value);
                await api.post('/harvest/yield-records', {
                    processingBatch: document.getElementById('fBatch').value,
                    productType: document.getElementById('fProductType').value,
                    inputWeight: input,
                    outputWeight: output,
                    wasteWeight: parseFloat(document.getElementById('fWasteWeight').value) || 0
                });
                bootstrap.Modal.getInstance(document.getElementById('formModal')).hide();
                loadData();
                alert(`Yield: ${((output/input)*100).toFixed(1)}%`);
            } catch (e) { alert('Error recording yield'); }
        }

        async function submitComplete() {
            try {
                await api.harvest.completeProcessing(document.getElementById('fBatch').value, {
                    outputQuantity: parseInt(document.getElementById('fOutputQty').value),
                    outputWeight: parseFloat(document.getElementById('fOutputWeight').value),
                    wasteWeight: parseFloat(document.getElementById('fWasteWeight').value) || 0,
                    storageLocation: document.getElementById('fStorage').value,
                    createInventory: document.getElementById('fCreateInv').checked
                });
                bootstrap.Modal.getInstance(document.getElementById('formModal')).hide();
                loadData();
                alert('Batch completed and added to inventory!');
            } catch (e) { alert('Error completing batch'); }
        }

        async function loadData() {
            try {
                const result = await api.harvest.getProcessingBatches();
                allProcessingBatches = result.success ? result.data : [];

                const inProgress = allProcessingBatches.filter(b => b.status === 'Processing');
                const completedToday = allProcessingBatches.filter(b => {
                    if (!b.completedAt) return false;
                    const d = new Date(b.completedAt);
                    const today = new Date();
                    return d.toDateString() === today.toDateString();
                });

                document.getElementById('statProcessing').textContent = inProgress.length;
                document.getElementById('statCompleted').textContent = completedToday.length;

                const yieldRecs = await api.harvest.getYieldRecords();
                if (yieldRecs.success && yieldRecs.data.length) {
                    const avg = yieldRecs.data.reduce((s, r) => s + (r.yieldPercentage || 0), 0) / yieldRecs.data.length;
                    document.getElementById('statYield').textContent = avg.toFixed(1) + '%';
                }

                document.getElementById('batchList').innerHTML = allProcessingBatches.filter(b => b.status === 'Processing' || b.status === 'Pending').map(b => `
                    <div class="d-flex justify-content-between align-items-center py-2 border-bottom">
                        <div>
                            <strong style="font-size:0.9rem;">${b.batchNumber}</strong><br>
                            <small class="text-muted">${b.productType} — ${new Date(b.processingDate).toLocaleDateString()}</small>
                        </div>
                        <span class="badge-status badge-${b.status === 'Processing' ? 'processing' : 'pending'}">${b.status}</span>
                    </div>
                `).join('') || '<p class="text-muted text-center">No active batches</p>';

                document.getElementById('recentSteps').innerHTML = allProcessingBatches.slice(0, 5).map(b => `
                    <div class="d-flex justify-content-between align-items-center py-2 border-bottom">
                        <div><small>${b.productType}</small><br><small class="text-muted">${b.batchNumber}</small></div>
                        <span class="badge-status badge-${b.status === 'Completed' ? 'approved' : 'pending'}">${b.status}</span>
                    </div>
                `).join('') || '<p class="text-muted text-center">No recent steps</p>';
            } catch (e) { console.error(e); }
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (checkAuth()) loadData();
        });
    </script>
</body>
</html>
