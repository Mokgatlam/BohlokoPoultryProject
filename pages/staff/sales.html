<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales - Bohloko Family Farm</title>
    <link rel="shortcut icon" type="image/x-icon" href="../../assets/images/icons/favicon.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
    <style>
        :root { --primary: #1B4332; --accent: #D4A843; --cream: #FDF8F0; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f0f2f5; min-height: 100vh; }
        .mobile-header { background: var(--primary); color: white; padding: 15px 20px; position: sticky; top: 0; z-index: 100; }
        .mobile-header h5 { margin: 0; font-size: 1.1rem; }
        .mobile-header small { opacity: 0.8; font-size: 0.8rem; }
        .content { padding: 15px; padding-bottom: 80px; }
        .stat-row { display: flex; gap: 10px; margin-bottom: 15px; overflow-x: auto; }
        .stat-box { background: white; border-radius: 12px; padding: 15px; min-width: 100px; flex: 1; box-shadow: 0 2px 8px rgba(0,0,0,0.06); text-align: center; }
        .stat-box .icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; margin: 0 auto 8px; font-size: 1.1rem; }
        .stat-box .icon.green { background: rgba(27,67,50,0.1); color: var(--primary); }
        .stat-box .icon.gold { background: rgba(212,168,67,0.1); color: var(--accent); }
        .stat-box .icon.blue { background: rgba(59,130,246,0.1); color: #3b82f6; }
        .stat-box h4 { font-size: 1.3rem; margin: 0; font-weight: 700; }
        .stat-box small { color: #666; font-size: 0.75rem; }
        .card { border: none; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 15px; }
        .card-header { background: white; border-bottom: 1px solid #eee; padding: 12px 15px; font-weight: 600; font-size: 0.95rem; border-radius: 12px 12px 0 0 !important; }
        .card-body { padding: 15px; }
        .btn-main { background: var(--primary); color: white; border: none; border-radius: 8px; padding: 10px 20px; font-weight: 600; width: 100%; }
        .btn-main:hover { background: #143a28; color: white; }
        .form-label { font-weight: 500; font-size: 0.85rem; margin-bottom: 4px; }
        .form-control, .form-select { border-radius: 8px; border: 1px solid #ddd; padding: 10px 12px; font-size: 0.9rem; }
        .table { font-size: 0.85rem; }
        .table th { font-weight: 600; font-size: 0.8rem; color: #666; }
        .badge-status { padding: 4px 10px; border-radius: 15px; font-size: 0.75rem; font-weight: 500; }
        .badge-approved { background: #d1fae5; color: #065f46; }
        .badge-pending { background: #fef3c7; color: #92400e; }
        .badge-cancelled { background: #fee2e2; color: #991b1b; }
        .badge-processing { background: #dbeafe; color: #1e40af; }
        .quick-action { display: flex; align-items: center; gap: 10px; padding: 12px 15px; background: white; border-radius: 10px; margin-bottom: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.04); cursor: pointer; border: none; width: 100%; text-align: left; }
        .quick-action:hover { background: #f8f9fa; }
        .quick-action .icon { width: 42px; height: 42px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; }
        .quick-action h6 { margin: 0; font-size: 0.9rem; font-weight: 600; }
        .quick-action small { color: #888; font-size: 0.75rem; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 1px solid #eee; display: flex; padding: 8px 0; z-index: 100; }
        .bottom-nav a { flex: 1; text-align: center; color: #666; text-decoration: none; font-size: 0.7rem; padding: 5px; }
        .bottom-nav a.active { color: var(--primary); }
        .bottom-nav a i { display: block; font-size: 1.2rem; margin-bottom: 2px; }
        .modal-content { border-radius: 12px; }
        .modal-header { background: var(--primary); color: white; border-radius: 12px 12px 0 0; }
        .order-card { background: white; border-radius: 10px; padding: 12px; margin-bottom: 10px; border-left: 4px solid var(--primary); }
        .order-card.processing { border-left-color: var(--accent); }
        .order-card.delivered { border-left-color: #22c55e; }
        .search-bar { position: relative; }
        .search-bar input { padding-left: 40px; }
        .search-bar i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #999; }
    </style>
    <link rel="stylesheet" href="../../assets/css/staff.css">
</head>
<body>
    <div class="mobile-header">
        <div class="d-flex justify-content-between align-items-center">
            <div>
                <h5><i class="fas fa-shopping-cart me-2"></i>Sales</h5>
                <small id="staffName">Loading...</small>
            </div>
            <button class="btn btn-sm btn-outline-light" onclick="logout()"><i class="fas fa-sign-out-alt"></i></button>
        </div>
    </div>

    <div class="content">
        <div class="stat-row">
            <div class="stat-box">
                <div class="icon green"><i class="fas fa-receipt"></i></div>
                <h4 id="statOrders">0</h4>
                <small>Orders Today</small>
            </div>
            <div class="stat-box">
                <div class="icon gold"><i class="fas fa-coins"></i></div>
                <h4 id="statRevenue">R0</h4>
                <small>Revenue Today</small>
            </div>
            <div class="stat-box">
                <div class="icon blue"><i class="fas fa-clock"></i></div>
                <h4 id="statPending">0</h4>
                <small>Pending</small>
            </div>
        </div>

        <h6 style="font-weight:600;margin-bottom:12px;">Quick Actions</h6>
        <button class="quick-action" onclick="openModal('viewOrders')">
            <div class="icon" style="background:rgba(27,67,50,0.1);color:var(--primary);"><i class="fas fa-clipboard-list"></i></div>
            <div><h6>View Orders</h6><small>Browse and manage all orders</small></div>
        </button>
        <button class="quick-action" onclick="openModal('processPayment')">
            <div class="icon" style="background:rgba(59,130,246,0.1);color:#3b82f6;"><i class="fas fa-credit-card"></i></div>
            <div><h6>Process Payment</h6><small>Record payment for an order</small></div>
        </button>
        <button class="quick-action" onclick="openModal('pickingList')">
            <div class="icon" style="background:rgba(212,168,67,0.1);color:var(--accent);"><i class="fas fa-clipboard-check"></i></div>
            <div><h6>Picking List</h6><small>View items to pick from inventory</small></div>
        </button>
        <button class="quick-action" onclick="openModal('dispatch')">
            <div class="icon" style="background:rgba(34,197,94,0.1);color:#22c55e;"><i class="fas fa-truck"></i></div>
            <div><h6>Dispatch Order</h6><small>Mark order as dispatched/delivered</small></div>
        </button>

        <div class="card mt-3">
            <div class="card-header">
                <div class="d-flex justify-content-between align-items-center">
                    <span><i class="fas fa-list me-2"></i>Recent Orders</span>
                    <div class="search-bar">
                        <i class="fas fa-search"></i>
                        <input type="text" class="form-control form-control-sm" placeholder="Search..." id="searchOrders" oninput="filterOrders()" style="width:150px;">
                    </div>
                </div>
            </div>
            <div class="card-body" id="orderList" style="max-height:500px;overflow-y:auto;">
                <p class="text-muted text-center">Loading...</p>
            </div>
        </div>

        <div class="card">
            <div class="card-header"><i class="fas fa-boxes me-2"></i>Inventory Summary</div>
            <div class="card-body" id="inventoryList" style="max-height:300px;overflow-y:auto;">
                <p class="text-muted text-center">Loading...</p>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <a href="poultry.html"><i class="fas fa-heartbeat"></i>Care</a>
        <a href="processing.html"><i class="fas fa-cut"></i>Process</a>
        <a href="sales.html" class="active"><i class="fas fa-shopping-cart"></i>Sales</a>
        <a href="../admin/dashboard.html"><i class="fas fa-cog"></i>Admin</a>
    </div>

    <div class="modal fade" id="formModal" tabindex="-1">
        <div class="modal-dialog modal-fullscreen-sm-down modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Form</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="modalBody"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/api.js"></script>
    <script>
        let allOrders = [];

        function checkAuth() {
            const token = localStorage.getItem('token');
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            if (!token || !['Sales Assistant', 'Farm Manager'].includes(user.role)) {
                alert('Please login as Sales Assistant');
                window.location.href = '../public/login.html';
                return false;
            }
            document.getElementById('staffName').textContent = `${user.firstName} ${user.lastName} — ${user.role}`;
            return true;
        }

        function logout() {
            api.removeToken();
            window.location.href = '../public/login.html';
        }

        function filterOrders() {
            const q = document.getElementById('searchOrders').value.toLowerCase();
            const filtered = allOrders.filter(o => o.orderNumber.toLowerCase().includes(q) || (o.items || []).some(i => i.productName.toLowerCase().includes(q)));
            renderOrders(filtered);
        }

        function renderOrders(orders) {
            document.getElementById('orderList').innerHTML = orders.map(o => `
                <div class="order-card ${o.status.toLowerCase()}">
                    <div class="d-flex justify-content-between align-items-start">
                        <div>
                            <strong style="font-size:0.9rem;">#${o.orderNumber}</strong>
                            <br><small class="text-muted">${new Date(o.orderDate).toLocaleDateString()}</small>
                            <br><small>${(o.items || []).length} item(s) — R${(o.totalAmount || 0).toFixed(2)}</small>
                        </div>
                        <div class="text-end">
                            <span class="badge-status badge-${o.status === 'Delivered' ? 'approved' : o.status === 'Cancelled' ? 'cancelled' : 'pending'}">${o.status}</span>
                            <br><small class="text-muted">${o.paymentStatus || 'Unpaid'}</small>
                        </div>
                    </div>
                </div>
            `).join('') || '<p class="text-muted text-center">No orders found</p>';
        }

        function openModal(type) {
            const titles = { viewOrders: 'All Orders', processPayment: 'Process Payment', pickingList: 'Picking List', dispatch: 'Dispatch Order' };
            document.getElementById('modalTitle').textContent = titles[type];

            const orderOptions = allOrders.map(o => `<option value="${o._id}">#${o.orderNumber} — R${(o.totalAmount||0).toFixed(2)} (${o.status})</option>`).join('');

            const forms = {
                viewOrders: `<div id="allOrdersTable" style="max-height:60vh;overflow-y:auto;">${allOrders.map(o => `
                    <div class="order-card ${o.status.toLowerCase()}">
                        <div class="d-flex justify-content-between">
                            <div>
                                <strong>#${o.orderNumber}</strong><br>
                                <small>${o.customerName || 'Walk-in'} — ${o.userType || ''}</small><br>
                                <small>${(o.items||[]).map(i => i.productName).join(', ') || 'No items'}</small>
                            </div>
                            <div class="text-end">
                                <strong>R${(o.totalAmount||0).toFixed(2)}</strong><br>
                                <span class="badge-status badge-${o.status === 'Delivered' ? 'approved' : o.status === 'Cancelled' ? 'cancelled' : 'pending'}">${o.status}</span>
                            </div>
                        </div>
                    </div>`).join('') || '<p class="text-muted text-center">No orders</p>'}</div>`,
                processPayment: `
                    <div class="mb-3"><label class="form-label">Order *</label><select class="form-select" id="fOrder">${orderOptions || '<option>No orders</option>'}</select></div>
                    <div class="mb-3"><label class="form-label">Payment Method *</label>
                        <select class="form-select" id="fPayMethod"><option>Cash</option><option>Card</option><option>EFT</option><option>Mobile Payment</option></select></div>
                    <div class="mb-3"><label class="form-label">Amount (ZAR) *</label><input type="number" class="form-control" id="fPayAmount" step="0.01" min="0"></div>
                    <div class="mb-3"><label class="form-label">Reference</label><input type="text" class="form-control" id="fPayRef" placeholder="e.g., EFT reference number"></div>
                    <button class="btn btn-main" onclick="submitPayment()">Record Payment</button>`,
                pickingList: `
                    <div class="mb-3"><label class="form-label">Filter by Status</label>
                        <select class="form-select" id="fPickStatus" onchange="loadPickingList()"><option>Pending</option><option>Picking</option><option>Picked</option></select></div>
                    <div id="pickingContent" style="max-height:50vh;overflow-y:auto;"><p class="text-muted">Loading...</p></div>`,
                dispatch: `
                    <div class="mb-3"><label class="form-label">Order *</label><select class="form-select" id="fOrder">${orderOptions || '<option>No orders</option>'}</select></div>
                    <div class="mb-3"><label class="form-label">Status *</label>
                        <select class="form-select" id="fDispatchStatus"><option>Dispatched</option><option>Delivered</option></select></div>
                    <div class="mb-3"><label class="form-label">Tracking Note</label><textarea class="form-control" id="fDispatchNote" rows="2" placeholder="e.g., Left at reception"></textarea></div>
                    <button class="btn btn-main" onclick="submitDispatch()">Dispatch</button>`
            };
            document.getElementById('modalBody').innerHTML = forms[type];
            new bootstrap.Modal(document.getElementById('formModal')).show();
            if (type === 'pickingList') loadPickingList();
        }

        async function loadPickingList() {
            try {
                const result = await api.inventory.getPickingLists();
                const status = document.getElementById('fPickStatus').value;
                const lists = (result.success ? result.data : []).filter(l => l.status === status);
                document.getElementById('pickingContent').innerHTML = lists.map(l => `
                    <div class="order-card">
                        <strong>Picking List #${l.listNumber || ''}</strong><br>
                        ${(l.items||[]).map(i => `<small>${i.productName || ''} — ${i.quantity} ${i.unit || 'kg'}</small>`).join('<br>') || '<small>No items</small>'}
                    </div>
                `).join('') || '<p class="text-muted text-center">No picking lists</p>';
            } catch (e) { document.getElementById('pickingContent').innerHTML = '<p class="text-danger">Error loading picking lists</p>'; }
        }

        async function submitPayment() {
            try {
                const orderId = document.getElementById('fOrder').value;
                await api.patch(`/orders/${orderId}/status`, {
                    paymentMethod: document.getElementById('fPayMethod').value,
                    paymentAmount: parseFloat(document.getElementById('fPayAmount').value),
                    paymentRef: document.getElementById('fPayRef').value,
                    paymentStatus: 'Paid'
                });
                bootstrap.Modal.getInstance(document.getElementById('formModal')).hide();
                loadData();
                alert('Payment recorded!');
            } catch (e) { alert('Error recording payment'); }
        }

        async function submitDispatch() {
            try {
                const orderId = document.getElementById('fOrder').value;
                await api.patch(`/orders/${orderId}/status`, {
                    status: document.getElementById('fDispatchStatus').value,
                    trackingNote: document.getElementById('fDispatchNote').value
                });
                bootstrap.Modal.getInstance(document.getElementById('formModal')).hide();
                loadData();
                alert('Order dispatched!');
            } catch (e) { alert('Error dispatching order'); }
        }

        async function loadData() {
            try {
                const result = await api.getOrders();
                allOrders = result.success ? result.data : [];

                const today = new Date().toDateString();
                const todayOrders = allOrders.filter(o => new Date(o.orderDate).toDateString() === today);
                const todayRevenue = todayOrders.reduce((s, o) => s + (o.totalAmount || 0), 0);
                const pending = allOrders.filter(o => o.status === 'Pending' || o.status === 'Processing');

                document.getElementById('statOrders').textContent = todayOrders.length;
                document.getElementById('statRevenue').textContent = 'R' + todayRevenue.toFixed(0);
                document.getElementById('statPending').textContent = pending.length;

                renderOrders(allOrders.slice(0, 20));

                const inv = await api.inventory.getInventory();
                if (inv.success && inv.data.length) {
                    document.getElementById('inventoryList').innerHTML = inv.data.filter(i => i.quantity > 0).slice(0, 10).map(i => `
                        <div class="d-flex justify-content-between align-items-center py-2 border-bottom">
                            <div><strong style="font-size:0.85rem;">${i.productName}</strong><br><small class="text-muted">${i.location || 'N/A'}</small></div>
                            <div class="text-end"><strong>${i.quantity} ${i.unit || 'kg'}</strong></div>
                        </div>
                    `).join('') || '<p class="text-muted text-center">No inventory items</p>';
                }
            } catch (e) { console.error(e); }
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (checkAuth()) loadData();
        });
    </script>
</body>
</html>
